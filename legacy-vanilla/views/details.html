<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Details</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <header>
    <div class="logo">MMS 🎥</div>
    <div class="controls">
      <a href="index.html" class="btn btn-secondary">&larr; Back to Dashboard</a>
    </div>
  </header>

  <main class="container">
    <div id="loadingIndicator">Loading details...</div>
    <div class="details-container" id="detailsContainer" style="display: none;">
      <div class="details-poster">
        <img id="detPoster" src="" alt="Movie Poster">
      </div>
      <div class="details-info">
        <h1 class="details-title" id="detTitle"></h1>
        <div class="details-meta">
          <span id="detGenre"></span>
          <span id="detLanguage"></span>
          <span id="detYear"></span>
          <span id="detDuration"></span>
          <span id="detRating"></span>
        </div>
        <p class="details-description" id="detDescription"></p>
      </div>
    </div>
  </main>

  <script type="module" src="../js/details.js"></script>
</body>
</html>
