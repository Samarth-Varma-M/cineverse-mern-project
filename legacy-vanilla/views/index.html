<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Management System</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout.css">
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <header>
    <div class="logo">MMS 🎥</div>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search movies...">
      <select id="genreFilter">
        <option value="">All Genres</option>
      </select>
      <select id="sortSelect">
        <option value="">Sort By...</option>
        <option value="rating-desc">Rating: High to Low</option>
        <option value="rating-asc">Rating: Low to High</option>
        <option value="year-desc">Newest First</option>
        <option value="language-asc">Language (A-Z)</option>
        <option value="language-desc">Language (Z-A)</option>
      </select>
      <label class="liked-filter-label">
        <input type="checkbox" id="likedFilter"> ❤️ Liked
      </label>
      <button class="btn" id="addMovieBtn">+ Add Movie</button>
    </div>
  </header>

  <main class="container">
    <div class="movie-grid" id="movieGrid">
      <!-- Movie cards rendered via JS -->
    </div>
  </main>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="movieModal">
    <div class="modal-content">
      <button class="close-modal" id="closeModal">&times;</button>
      <h2 id="modalTitle">Add Movie</h2>
      <form id="movieForm">
        <label>Title *</label>
        <input type="text" id="title" required>
        
        <label>Genre *</label>
        <input type="text" id="genre" required>
        
        <label>Language</label>
        <input type="text" id="language">
        
        <div style="display: flex; gap: 1rem;">
          <div style="flex:1;">
            <label>Release Year *</label>
            <input type="number" id="releaseYear" required min="1800" max="2100">
          </div>
          <div style="flex:1;">
            <label>Rating (0-10)</label>
            <input type="number" id="rating" step="0.1" min="0" max="10">
          </div>
          <div style="flex:1;">
            <label>Duration (mins)</label>
            <input type="number" id="duration" min="1">
          </div>
        </div>

        <label>Poster Image URL</label>
        <input type="url" id="poster" placeholder="https://...">

        <label>Description</label>
        <textarea id="description" rows="3"></textarea>
        
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn">Save Movie</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/main.js"></script>
</body>
</html>
