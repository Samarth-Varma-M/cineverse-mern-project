services:
  # CineVerse Backend API Service
  - type: web
    name: cineverse-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Set in Render Dashboard from MongoDB Atlas
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # Set to frontend deployed URL

  # CineVerse React Frontend Static Site
  - type: web
    name: cineverse-frontend
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to backend service URL (e.g. https://cineverse-backend.onrender.com)

